name: Windows

# Builds the Windows port (windows/): runs the unit tests once they exist, the native engine smoke
# tests on x64 and ARM64, and packages a signed sideload MSIX per architecture for the QA VM
# (artifact EchoDiar-win-<arch>).
# Signing uses the dev certificate in the WINDOWS_DEV_CERT_PFX / WINDOWS_DEV_CERT_PASSWORD
# secrets; pull requests from forks get no secrets and build an unsigned package.

on:
  push:
    branches: [plan/2026-10-21-windows-port, main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Resources.resw must match the macOS Localizable.xcstrings it is generated from.
      - name: Check strings
        run: python -I windows/tools/xcstrings_to_resw.py --check

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      # A job-level hashFiles() guard never runs (checkout has not happened yet), so probe here.
      - id: probe
        name: Probe for tests
        run: |
          $hasTests = Test-Path windows/tests/EchoDiar.Tests/EchoDiar.Tests.csproj
          "has_tests=$($hasTests.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # Native model tests run only in the native-smoke job. Run from windows/ so global.json applies.
      - name: Test
        if: steps.probe.outputs.has_tests == 'true'
        working-directory: windows
        run: dotnet test tests/EchoDiar.Tests/EchoDiar.Tests.csproj --filter "Category!=Native&Category!=NativeLLM"

  # Same as test, on a native ARM64 runner (the QA VM is ARM64).
  test-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - id: probe
        name: Probe for tests
        run: |
          "Runner: $env:RUNNER_ARCH, OS arch: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          $hasTests = Test-Path windows/tests/EchoDiar.Tests/EchoDiar.Tests.csproj
          "has_tests=$($hasTests.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test
        if: steps.probe.outputs.has_tests == 'true'
        working-directory: windows
        run: dotnet test tests/EchoDiar.Tests/EchoDiar.Tests.csproj --filter "Category!=Native&Category!=NativeLLM"

  # The real engines on their native libraries (Whisper.net, sherpa-onnx) on x64 and ARM64. The tests download
  # their pinned, SHA-256 checked models from Hugging Face into ECHODIAR_TEST_MODELS, cached between runs.
  native-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      # Keyed by the SHA-256 of ggml-tiny.bin, the pyannote segmentation model and the campplus embedding.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/echodiar-test-models
          key: echodiar-test-models-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21-220ad67ca923bef2fa91f2390c786097bf305bceb5e261d4af67b38e938e1079-aa3cfc16963a10586a9393f5035d6d6b57e98d358b347f80c2a30bf4f00ceba2

      - name: Native smoke tests
        working-directory: windows
        env:
          ECHODIAR_TEST_MODELS: ${{ runner.temp }}/echodiar-test-models
        run: |
          "Runner: $env:RUNNER_ARCH, OS arch: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          dotnet test tests/EchoDiar.Tests/EchoDiar.Tests.csproj --filter Category=Native --logger "console;verbosity=detailed"

  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM_NAME: ${{ matrix.arch == 'arm64' && 'ARM64' || 'x64' }}
    steps:
      - name: Set paths
        run: |
          "PFX_PATH=$env:RUNNER_TEMP\EchoDiarDev.pfx" >> $env:GITHUB_ENV
          "OUT_DIR=$env:RUNNER_TEMP\AppPackages" >> $env:GITHUB_ENV
          "STAGE_DIR=$env:RUNNER_TEMP\artifact" >> $env:GITHUB_ENV

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Patch manifest version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $path = 'windows/src/EchoDiar.App/Package.appxmanifest'
          $xml = Get-Content -Raw $path
          $pattern = '(<Identity\b[^>]*?\bVersion=")[^"]*(")'
          if ($xml -notmatch $pattern) { throw "Identity Version not found in $path" }
          $patched = [regex]::Replace($xml, $pattern, "`${1}0.0.$env:RUN_NUMBER.0`${2}")
          Set-Content -Path $path -Value $patched -NoNewline -Encoding utf8
          Select-String -Path $path -Pattern 'Version="0\.0\.' | ForEach-Object { $_.Line.Trim() }

      - name: Decode signing certificate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_DEV_CERT_PFX }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'WINDOWS_DEV_CERT_PFX is empty' }
          [IO.File]::WriteAllBytes($env:PFX_PATH, [Convert]::FromBase64String($env:PFX_BASE64))

      # MSBuild (Visual Studio) packages the single-project MSIX; dotnet publish is the fallback
      # if the runner's MSBuild cannot build net10.0 WinUI.
      - name: Build MSIX
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_DEV_CERT_PASSWORD }}
        run: |
          $props = @(
            '/p:Configuration=Debug',
            "/p:Platform=$env:PLATFORM_NAME",
            "/p:RuntimeIdentifier=win-$env:ARCH",
            '/p:GenerateAppxPackageOnBuild=true',
            '/p:UapAppxPackageBuildMode=SideloadOnly',
            '/p:AppxBundle=Never',
            "/p:AppxPackageDir=$env:OUT_DIR\"
          )
          if (Test-Path $env:PFX_PATH) {
            $props += '/p:AppxPackageSigningEnabled=true'
            $props += "/p:PackageCertificateKeyFile=$env:PFX_PATH"
            $props += "/p:PackageCertificatePassword=$env:PFX_PASSWORD"
          } else {
            Write-Host 'No signing certificate (fork pull request): building an unsigned package.'
            $props += '/p:AppxPackageSigningEnabled=false'
          }
          msbuild windows/src/EchoDiar.App/EchoDiar.App.csproj /restore /nologo /v:minimal @props
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fails unless every native library ships in the .msix for this architecture, and the only
      # onnxruntime.dll is sherpa-onnx's (a WASDK ML copy winning would break diarization).
      - name: Check package contents
        run: |
          function Get-PeMachine([string]$path) {
            $fs = [IO.File]::OpenRead($path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              if ($br.ReadUInt16() -ne 0x5A4D) { throw "No MZ header: $path" }
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "No PE signature: $path" }
              return [int]$br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $expected = if ($env:ARCH -eq 'arm64') { 0xAA64 } else { 0x8664 }
          $msix = @(Get-ChildItem -LiteralPath $env:OUT_DIR -Recurse -File -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "Expected one .msix under $env:OUT_DIR, found $($msix.Count)" }
          $root = Join-Path $env:RUNNER_TEMP 'msix-contents'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($msix[0].FullName, $root)
          $rt = "runtimes/win-$env:ARCH"
          # Exact paths (Whisper.net, sherpa-onnx) and names searched recursively (LLamaSharp: x64 splits
          # into avx/avx2/avx512/noavx folders).
          $exact = @("$rt/whisper.dll", "$rt/ggml-whisper.dll", "$rt/ggml-base-whisper.dll", "$rt/ggml-cpu-whisper.dll",
            'sherpa-onnx-c-api.dll', 'onnxruntime.dll')
          $llama = @('llama.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu.dll')
          $files = @()
          $errors = @()
          foreach ($rel in $exact) {
            $path = Join-Path $root $rel
            if (Test-Path -LiteralPath $path) { $files += Get-Item -LiteralPath $path } else { $errors += "Missing $rel" }
          }
          $llamaDir = Join-Path $root "$rt/native"
          foreach ($name in $llama) {
            $found = @(if (Test-Path -LiteralPath $llamaDir) { Get-ChildItem -LiteralPath $llamaDir -Recurse -File -Filter $name })
            if ($found.Count -eq 0) { $errors += "Missing $rt/native/**/$name" } else { $files += $found }
          }
          foreach ($file in $files) {
            $machine = Get-PeMachine $file.FullName
            $rel = $file.FullName.Substring($root.Length + 1)
            '{0,-50} 0x{1:X4}' -f $rel, $machine
            if ($machine -ne $expected) { $errors += ('{0}: machine 0x{1:X4}, expected 0x{2:X4}' -f $rel, $machine, $expected) }
          }
          $ort = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'onnxruntime.dll')
          if ($ort.Count -ne 1) {
            $errors += "Expected exactly one onnxruntime.dll in the package, found $($ort.Count): " +
              (($ort | ForEach-Object { $_.FullName.Substring($root.Length + 1) }) -join ', ')
          } else {
            $nuget = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
            $ref = @(Get-ChildItem -Path (Join-Path $nuget "org.k2fsa.sherpa.onnx.runtime.win-$env:ARCH") -Recurse -File -Filter 'onnxruntime.dll' -ErrorAction SilentlyContinue)
            "sherpa-onnx runtime onnxruntime.dll: $(($ref | ForEach-Object FullName) -join ', ')"
            if ($ref.Count -ne 1) {
              $errors += "Expected one onnxruntime.dll in the restored org.k2fsa.sherpa.onnx.runtime.win-$env:ARCH package under $nuget, found $($ref.Count)"
            } else {
              $pkgVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($ort[0].FullName).FileVersion
              $refVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($ref[0].FullName).FileVersion
              "onnxruntime.dll FileVersion: package '$pkgVersion', sherpa-onnx '$refVersion'"
              if (-not $refVersion -or $pkgVersion -ne $refVersion) {
                $errors += "onnxruntime.dll FileVersion '$pkgVersion' in the package does not match sherpa-onnx's '$refVersion' (another package's copy won)"
              }
            }
          }
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; throw "Package contents check failed ($($errors.Count) problems)" }
          'Package contents OK.'

      - name: Stage artifact
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_DEV_CERT_PASSWORD }}
        run: |
          Get-ChildItem -LiteralPath $env:OUT_DIR -Recurse -File | Select-Object -ExpandProperty FullName
          $msix = @(Get-ChildItem -LiteralPath $env:OUT_DIR -Recurse -File -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "Expected one .msix under $env:OUT_DIR, found $($msix.Count)" }
          New-Item -ItemType Directory -Path $env:STAGE_DIR | Out-Null
          Copy-Item -LiteralPath $msix[0].FullName -Destination $env:STAGE_DIR
          $deps = Join-Path $msix[0].DirectoryName 'Dependencies'
          if (Test-Path $deps) { Copy-Item -LiteralPath $deps -Destination $env:STAGE_DIR -Recurse }
          if (Test-Path $env:PFX_PATH) {
            # Public certificate only: the PFX never leaves the runner.
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($env:PFX_PATH, $env:PFX_PASSWORD)
            $der = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            [IO.File]::WriteAllBytes((Join-Path $env:STAGE_DIR 'EchoDiarDev.cer'), $der)
          }
          Copy-Item -LiteralPath windows/scripts/vm-install.ps1 -Destination $env:STAGE_DIR
          if (Get-ChildItem -LiteralPath $env:STAGE_DIR -Recurse -File -Include '*.pfx', '*.p12') { throw 'Private key in artifact' }
          Get-ChildItem -LiteralPath $env:STAGE_DIR -Recurse -File | ForEach-Object { $_.FullName.Substring($env:STAGE_DIR.Length + 1) }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EchoDiar-win-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifact
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing certificate
        if: always()
        run: Remove-Item -LiteralPath $env:PFX_PATH -Force -ErrorAction SilentlyContinue
