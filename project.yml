name: EchoDiar
options:
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
packages:
  EchoKit:
    path: Packages/EchoKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.0, pinned by commit (git ls-remote ... refs/tags/2.10.0; lightweight tag, no ^{}).
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  base:
    DEVELOPMENT_TEAM: 86H6CNLN4C
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  EchoDiar:
    type: application
    platform: macOS
    sources:
      - EchoDiar
      - path: assets/logo.icon
      # About panel logo.
      - path: assets/logo_square_512.png
        buildPhase: resources
      # Menu bar icon: white on a dark menu bar, black on a light one.
      - path: assets/logo_white.png
        buildPhase: resources
      - path: assets/logo_black.png
        buildPhase: resources
    dependencies:
      - package: EchoKit
        product: EchoCore
      - package: EchoKit
        product: EchoAudio
      - package: EchoKit
        product: EchoTranscribe
      - package: EchoKit
        product: EchoAI
      - package: EchoKit
        product: EchoLocalLLM
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dinh.thi.EchoDiar
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 6
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: logo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: EchoDiar/Info.plist
        CODE_SIGN_ENTITLEMENTS: EchoDiar/EchoDiar.entitlements
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Anh-Thi Dinh"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Debug is Developer ID-signed too, so mic and system-audio grants survive rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
schemes:
  EchoDiar:
    build:
      parallelizeBuild: false
      targets:
        EchoDiar: all
    test:
      targets:
        - package: EchoKit/EchoCoreTests
        - package: EchoKit/EchoAudioTests
        - package: EchoKit/EchoTranscribeTests
        - package: EchoKit/EchoAITests
